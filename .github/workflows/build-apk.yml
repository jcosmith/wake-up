name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-timer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Publish the APK on a rolling "latest" release so it can be downloaded
      # straight onto a phone.
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Coffee Timer (latest build)
          body: Built from ${{ github.sha }}. Install app-release.apk on Android (allow installs from unknown sources).
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
